name: Update main.yml

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 7
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "7.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Localiser le fichier .csproj
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
          if (-not $proj) {
            Write-Error "Aucun fichier .csproj trouve dans le depot"
            exit 1
          }
          Write-Host "Projet trouve : $($proj.FullName)"
          echo "CSPROJ_PATH=$($proj.FullName)" >> $env:GITHUB_ENV

      - name: Restore dependencies
        run: dotnet restore "${{ env.CSPROJ_PATH }}"

      - name: Build (Release)
        run: dotnet build "${{ env.CSPROJ_PATH }}" --no-restore -c Release

      - name: Publish (single-file, self-contained for win-x64)
        run: dotnet publish "${{ env.CSPROJ_PATH }}" -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o publish

      - name: Zip publish folder
        shell: pwsh
        run: |
          if (Test-Path publish) {
            Compress-Archive -Path publish\* -DestinationPath publish.zip -Force
          } else {
            Write-Error "Publish folder not found"
            exit 1
          }

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish-windows
          path: publish.zip
